# This job deploys the Nginx container using Docker
deploy_nginx:
  image: docker:latest
  stage: deploy_nginx
  services:
    - docker:dind
  before_script:
    - docker --version
  script:
    - docker pull nginx:latest
    - docker run --name nginx-container -d -p 80:80 nginx
